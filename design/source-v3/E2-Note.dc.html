    <section class="card feed">

    <div class="sheet-save" style="padding-bottom: 12px;"><button class="btn btn-primary btn-full" type="button">Save</button></div>
  </div>

  <div class="kb" aria-hidden="true">
    <div class="kb-row"><span>q</span><span>w</span><span>e</span><span>r</span><span>t</span><span>y</span><span>u</span><span>i</span><span>o</span><span>p</span></div>
