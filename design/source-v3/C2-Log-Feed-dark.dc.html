<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C2 Log Feed, dark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sophi.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone dark">
  <div class="island"></div>
  <div class="safe-top"></div>
  <div class="screen">
    <header class="hdr">
      <div>
        <h1>Sophie</h1>
        <p class="sub">Day 4 · Mon, Nov 2</p>
      </div>
      <span class="av"><img class="avatar40" src="/_blob/a1977d86296544640bcd0826003c5b13" alt="Sophie's avatar"></span>
    </header>
    <section class="card feed">
      <div class="big">Last feed 1 hr 45 min ago</div>
      <div class="line2">Next feed about 5:45 to 6:45 PM</div>
      <span class="btn btn-primary btn-full"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h4v3h-4z"/><path d="M9 6h6l1 3v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9z"/><path d="M8 13h8"/></svg>Log feed</span>
    </section>
    <section class="card">
      <h2>Today so far</h2>
      <div class="stats">
        <div class="stat"><span class="k">Feeds <span>6 of 8</span></span><span class="status st-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>On track</span></div>
        <div class="stat"><span class="k">Wet diapers <span>3 of 4</span></span><span class="status st-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>On track</span></div>
        <div class="stat"><span class="k">Dirty diapers <span>2 of 2</span></span><span class="status st-ok"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>On track</span></div>
      </div>
    </section>
  </div>

  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Feed">
    <div class="grab"></div>
    <div class="sheet-head"><h1>Feed</h1><a class="x" href="A2-Today-dark.dc.html" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <div><button class="chip" type="button" aria-label="Time: now. Change time"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Now</button></div>

    <div class="field">
      <span class="q">How much was in the bottle?</span>
      <div class="stepper">
        <button type="button" aria-label="5 mL less">−</button>
        <div class="val">60<small>mL</small></div>
        <button type="button" aria-label="5 mL more">+</button>
      </div>
      <div class="chips five">
        <button class="chip" type="button">30</button>
        <button class="chip" type="button">45</button>
        <button class="chip on" type="button" aria-pressed="true">60</button>
        <button class="chip" type="button">75</button>
        <button class="chip" type="button">90</button>
      </div>
    </div>

    <button class="collapsed" type="button"><span>Left in bottle <span class="opt">(optional)</span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="collapsed" type="button"><span>Add a note</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>

    <div class="sheet-save"><button class="btn btn-primary btn-full" type="button">Save · 60 mL</button></div>
  </div>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
