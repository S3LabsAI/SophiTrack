<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, light mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sophi.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="phone">
  <div class="island"></div>
  <div class="safe-top"></div>
  <div class="screen">
    <header class="hdr"><div><h1>Trends</h1><p class="sub">Days 1–7</p></div></header>
    <div class="seg" style="align-self: flex-start;"><button type="button">24 hrs</button><button class="on" type="button">7 days</button><button type="button">30 days</button></div>
    <section class="card" style="gap: 6px;">
      <h2>Daily intake (mL)</h2>
      <div class="chart"><div class="col"><div class="b2" style="height: 0.0%;"></div><div class="b1" style="height: 10.0%;"></div></div><div class="col"><div class="b2" style="height: 20.0%;"></div><div class="b1" style="height: 5.0%;"></div></div><div class="col"><div class="b2" style="height: 33.8%;"></div><div class="b1" style="height: 9.5%;"></div></div><div class="col"><div class="b2" style="height: 53.5%;"></div><div class="b1" style="height: 19.8%;"></div></div><div class="col"><div class="b2" style="height: 57.7%;"></div><div class="b1" style="height: 22.3%;"></div></div><div class="col"><div class="b2" style="height: 60.7%;"></div><div class="b1" style="height: 26.0%;"></div></div><div class="col"><div class="b2" style="height: 64.3%;"></div><div class="b1" style="height: 29.0%;"></div></div></div><div class="xlab"><span>D1</span><span>D2</span><span>D3</span><span>D4</span><span>D5</span><span>D6</span><span>D7</span></div>
      <div class="legend"><span><i class="dot" style="background: var(--bm);"></i>Breast milk</span><span><i class="dot" style="background: var(--fm);"></i>Formula</span></div>
    </section>
    <section class="card" style="gap: 6px;">
      <h2>% breast milk per day</h2>
      <svg viewBox="0 0 330 100" width="100%" height="100" role="img" aria-label="Percent breast milk per day, 100 then 20 to 31 percent"><polyline points="10,10.0 62,74.0 114,72.4 166,68.4 218,67.6 270,66.0 322,65.2" fill="none" stroke="var(--bm)" stroke-width="2" stroke-linejoin="round"/><circle cx="10" cy="10.0" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="62" cy="74.0" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="114" cy="72.4" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="166" cy="68.4" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="218" cy="67.6" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="270" cy="66.0" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><circle cx="322" cy="65.2" r="4" fill="var(--bm)" stroke="var(--card)" stroke-width="2"/><text x="322" y="57.2" text-anchor="end" font-size="11" fill="var(--text2)">31%</text><text x="10" y="8" font-size="11" fill="var(--text2)">100%</text></svg><div class="xlab"><span>D1</span><span>D2</span><span>D3</span><span>D4</span><span>D5</span><span>D6</span><span>D7</span></div>
    </section>
    <section class="card" style="gap: 6px;">
      <div class="between"><h2>Feeds per day vs. minimum</h2><span class="small">Today so far: 6</span></div>
      <div style="position: relative;"><div class="chart" style="height: 90px;"><div class="col"><div class="b3" style="height: 70%;"></div></div><div class="col"><div class="b3" style="height: 80%;"></div></div><div class="col"><div class="b3" style="height: 80%;"></div></div><div class="col"><div class="b3" style="height: 80%;"></div></div><div class="col"><div class="b3" style="height: 90%;"></div></div><div class="col"><div class="b3" style="height: 80%;"></div></div><div class="col"><div class="b3" style="height: 60%;"></div></div></div><div class="minline" style="top: 10px;"></div><span class="tiny" style="position: absolute; right: 0; top: -4px; background: var(--card); padding: 0 4px; color: var(--low); font-weight: 600;">min 8</span></div><div class="xlab"><span>D1</span><span>D2</span><span>D3</span><span>D4</span><span>D5</span><span>D6</span><span>D7</span></div>
    </section>
    <section class="card" style="gap: 6px; min-height: 60px;">
      <div class="between"><h2>Wet &amp; dirty diapers vs. minimum</h2><span class="tiny">scrolls ↓</span></div>
    </section>
  </div>
  <nav class="tabbar" aria-label="Main">
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Timeline</button>
    <div><a href="QuickLog.dc.html" class="fab" aria-label="Log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><div class="fab-label">Log</div></div>
    <button class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Trends</button>
    <button class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9-9a4.5 4.5 0 0 1 9-3 4.5 4.5 0 0 1 9 3c-2 4.5-9 9-9 9z"/></svg>Care</button>
  </nav>
  <div class="homebar"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
